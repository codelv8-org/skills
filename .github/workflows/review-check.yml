name: Skill review checks

on:
  pull_request:
    paths:
      - 'assets/js/skill-reviews.js'
      - 'assets/js/skill-insights.js'
      - 'scripts/*insights*.mjs'
      - 'scripts/*benchmark*'
      - 'scripts/catalog-browser-smoke.mjs'
      - 'scripts/photoreal-browser-smoke.mjs'
      - 'scripts/*photoreal*.py'
      - 'scripts/*head*.py'
      - 'scripts/build-skill-workflows.mjs'
      - 'assets/examples/photoreal-head/**'
      - 'assets/skill-workflows/**'
      - 'skills/photoreal-head-web/**'
      - 'data/skill-insights.json'
      - 'data/skills.json'
      - '.github/workflows/review-labels.yml'
      - 'assets/css/skill-reviews.css'
      - 'scripts/*rating*.mjs'
      - 'data/ratings.json'
      - 'data/reviews.json'
      - 'index.html'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/review-check.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: |
          node --check assets/js/skill-reviews.js
          node --check assets/js/skill-insights.js
          node --test scripts/skill-ratings.test.mjs scripts/skill-insights.test.mjs
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/skill-benchmark-requirements.txt -r skills/photoreal-head-web/scripts/requirements-projection.txt
      - run: python scripts/run-skill-tool-benchmarks.py
      - name: Build public Photoreal Head example
        run: |
          node --check assets/examples/photoreal-head/viewer.js
          node --check assets/examples/photoreal-head/projection-lab.js
          python scripts/test-photoreal-example.py
          python scripts/build-photoreal-example.py --strict
      - run: node scripts/build-skill-insights.mjs
      - run: node scripts/build-skill-workflows.mjs --check
      - name: Build native Archify diagrams (same pinned release as Pages)
        run: |
          git init "$RUNNER_TEMP/archify"
          git -C "$RUNNER_TEMP/archify" fetch --depth=1 https://github.com/tt-a1i/archify.git 3ca198d867ce4b616332f846ff66e5c8e5e60f95
          git -C "$RUNNER_TEMP/archify" checkout --detach FETCH_HEAD
          node scripts/build-skill-workflows.mjs --archify="$RUNNER_TEMP/archify"
      - name: Install browser test library
        run: npm install --no-save --package-lock=false --ignore-scripts playwright-core@1.56.1
      - name: Test catalog in headless Chrome
        run: node scripts/catalog-browser-smoke.mjs
      - name: Test generated Photoreal Head example in headless Chrome
        env:
          PHOTOREAL_SMOKE_ARTIFACTS: ${{ runner.temp }}/photoreal-smoke
        run: node scripts/photoreal-browser-smoke.mjs
      - name: Keep public example QA evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: public-head-review-evidence
          retention-days: 7
          if-no-files-found: ignore
          path: |
            assets/examples/photoreal-head/reports/projection_lab.json
            assets/examples/photoreal-head/projection-lab/
            ${{ runner.temp }}/photoreal-smoke/
