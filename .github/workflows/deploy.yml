name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  issues:
    types: [labeled, unlabeled, edited, deleted, transferred]
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'issues' || contains(github.event.issue.labels.*.name, 'skill-review-approved') || github.event.label.name == 'skill-review-approved'
    permissions:
      contents: read
      actions: read
      issues: read
      pages: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Set up Python for documentation examples
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install example PDF dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core poppler-utils libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
          python -m pip install -r scripts/documentation-examples-requirements.txt

      - name: Build and validate synthetic documentation examples
        run: python scripts/build-documentation-examples.py

      - name: Set up Node.js for Archify
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Test skill review validation
        run: |
          node --check assets/js/skill-reviews.js
          node --check assets/js/skill-insights.js
          node --test scripts/skill-ratings.test.mjs scripts/skill-insights.test.mjs

      - name: Build approved skill ratings
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/build-skill-ratings.mjs

      - name: Install benchmark dependencies
        run: |
          python -m pip install -r scripts/skill-benchmark-requirements.txt -r skills/photoreal-head-web/scripts/requirements-projection.txt
      - name: Run allowlisted skill tool benchmarks
        run: python scripts/run-skill-tool-benchmarks.py

      - name: Build Photoreal Head projection example and overview
        run: |
          node --check assets/examples/photoreal-head/projection-lab.js
          node --check assets/examples/photoreal-head/viewer.js
          python scripts/test-photoreal-example.py
          python scripts/build-photoreal-example.py --strict

      - name: Build benchmark and review analytics
        env:
          SKILL_REVIEW_AI_ENABLED: ${{ vars.SKILL_REVIEW_AI_ENABLED }}
          SKILL_REVIEW_AI_MODEL: ${{ vars.SKILL_REVIEW_AI_MODEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/build-skill-insights.mjs

      - name: Validate catalog workflow sources
        run: node scripts/build-skill-workflows.mjs --check

      - name: Build native Archify diagrams (pinned upstream)
        run: |
          git init "$RUNNER_TEMP/archify"
          git -C "$RUNNER_TEMP/archify" fetch --depth=1 https://github.com/tt-a1i/archify.git 3ca198d867ce4b616332f846ff66e5c8e5e60f95
          git -C "$RUNNER_TEMP/archify" checkout --detach FETCH_HEAD
          node scripts/build-skill-workflows.mjs --archify="$RUNNER_TEMP/archify"

      - name: Build skill ZIP files
        run: python3 scripts/build-skill-zips.py

      - name: Install browser test library
        run: npm install --no-save --package-lock=false --ignore-scripts playwright-core@1.56.1

      - name: Test generated Photoreal Head example in headless Chrome
        env:
          PHOTOREAL_SMOKE_ARTIFACTS: ${{ runner.temp }}/photoreal-smoke
        run: node scripts/photoreal-browser-smoke.mjs

      - name: Keep public example QA evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: public-head-pages-evidence
          retention-days: 7
          if-no-files-found: ignore
          path: |
            assets/examples/photoreal-head/reports/projection_lab.json
            assets/examples/photoreal-head/projection-lab/
            ${{ runner.temp }}/photoreal-smoke/

      - name: Remove browser test dependencies from Pages artifact
        run: rm -rf node_modules

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '.'

  deploy:
    needs: build
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
