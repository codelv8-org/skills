<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>Character Crowd Benchmark</title>
<style>body{margin:0;background:#0b1324;color:#e5edf9;font:14px system-ui}header{padding:13px;display:flex;align-items:center;flex-wrap:wrap;gap:12px;background:#14243c}button,select{padding:8px;border-radius:7px;border:1px solid #3f5474;background:#192d48;color:inherit}button{cursor:pointer}canvas{display:block;width:100vw;height:calc(100vh - 140px)}#results{font:12px ui-monospace,monospace;white-space:pre-wrap;line-height:1.6;padding:9px 14px}</style></head><body>
<header><strong>Low-poly Character Crowd Test</strong><label>Characters <select id="count"><option>1</option><option>10</option><option>30</option><option>50</option><option>100</option></select></label><label>Animation <select id="clip"><option value="">None</option><option>Idle</option><option>Walk</option><option>Run</option><option>Salute</option></select></label><label><input id="shadows" type="checkbox"/> Shadows</label><button id="reset">Rebuild</button><button id="export">Export 10s reading</button></header>
<div id="results">Benchmark not started</div><script type="module" src="/main.js"></script></body></html>
