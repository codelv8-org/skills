<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - ไม่พบหน้าที่ต้องการ | AI Skill Library</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --primary-light: #eff6ff;
      --bg-page: #f8fafc;
      --bg-card: #ffffff;
      --border: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --radius-md: 12px;
      --shadow-md: 0 10px 25px -5px rgba(0,0,0,0.06), 0 8px 10px -6px rgba(0,0,0,0.04);
      --font-family: 'Prompt', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --primary: #60a5fa;
        --primary-hover: #3b82f6;
        --primary-light: #1e293b;
        --bg-page: #0b0f19;
        --bg-card: #131b2e;
        --border: #26334d;
        --text-main: #f8fafc;
        --text-muted: #94a3b8;
        --shadow-md: 0 10px 25px -5px rgba(0,0,0,0.4);
      }
    }

    [data-theme="dark"] {
      --primary: #60a5fa;
      --primary-hover: #3b82f6;
      --primary-light: #1e293b;
      --bg-page: #0b0f19;
      --bg-card: #131b2e;
      --border: #26334d;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --shadow-md: 0 10px 25px -5px rgba(0,0,0,0.4);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-family);
      background: var(--bg-page);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }

    .error-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 48px 32px;
      max-width: 520px;
      width: 100%;
      box-shadow: var(--shadow-md);
      animation: fadeIn 0.4s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .error-code {
      font-size: 5rem;
      font-weight: 700;
      color: var(--primary);
      line-height: 1;
      margin-bottom: 12px;
      font-family: 'JetBrains Mono', monospace;
    }

    .error-icon {
      font-size: 3rem;
      margin-bottom: 16px;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 12px;
    }

    p {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 28px;
      line-height: 1.6;
    }

    .btn-home {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--primary);
      color: #ffffff;
      padding: 12px 24px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 500;
      font-size: 0.95rem;
      transition: all 0.2s;
    }

    .btn-home:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
    }

    .footer-text {
      margin-top: 24px;
      font-size: 0.8rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="error-card">
    <div class="error-icon">🧭</div>
    <div class="error-code">404</div>
    <h1>ไม่พบหน้าที่คุณต้องการ</h1>
    <p>ลิงก์อาจถูกย้าย ลบออกไป หรือคุณอาจพิมพ์ URL ไม่ถูกต้อง กรุณากลับไปยังหน้าแคตตาล็อกหลักเพื่อค้นหา Skill ที่ต้องการ</p>
    <a id="homeLink" href="./" class="btn-home">
      <span>🏠</span>
      <span>กลับสู่หน้าแคตตาล็อก (Home)</span>
    </a>
  </div>
  <div class="footer-text">
    🧠 Personal AI Skill Library • GitHub Pages
  </div>

  <script>
    // Automatically detect correct base path for GitHub Pages or root
    const homeLink = document.getElementById('homeLink');
    if (location.pathname.includes('/skills/')) {
      homeLink.href = location.origin + '/skills/';
    } else {
      homeLink.href = './';
    }
  </script>
</body>
</html>
